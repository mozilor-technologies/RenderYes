# Publish every public @renderyes/* package to npm, on a version tag.
#
# All eleven release in lockstep at one version, so one tag is one release and
# `pnpm publish -r` is the whole of it — pnpm rewrites each `workspace:*`
# dependency to that version as it packs. Publishing the packages individually
# with `npm publish` would ship `workspace:*` verbatim and 404 on install.
#
# ── Moving to trusted publishing (OIDC), later ────────────────────────────────
# The goal is no long-lived NPM_TOKEN in repository secrets. It is not possible
# for the FIRST release: a trusted publisher is registered in a package's own
# settings on npmjs.com, and until a package is published it has no settings.
# So: publish once with a token, then switch. The switch needs
#   * pnpm >= 11.0.7 (OIDC applies per package during a recursive publish) and
#     Node >= 22.14.0 — the Node side is already met (this repository builds on
#     Node 22), so only pnpm 10.20.0 moves, and `packageManager` moves with it;
#   * `id-token: write` on this job (already set below, harmless until used);
#   * each of the eleven packages registered on npmjs.com with this repository
#     and the workflow filename `release.yml`. Every field is case-sensitive.
# Once that is done, delete the NODE_AUTH_TOKEN line: npm detects the OIDC
# environment on its own, and provenance is generated automatically for a
# public repository.
name: release

on:
  push:
    tags: ["v*"]
  # Deliberate: a release you can start by hand, for a retry after a partial
  # publish. It still runs every gate below.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Point this at a protected GitHub environment to require an approval before
    # anything reaches the registry. An unpublish window is 72 hours; a review is
    # cheaper than needing one.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The same gates as CI, re-run here rather than trusted from the commit's
      # earlier run: a tag can point at anything, and a publish cannot be undone
      # after 72 hours.
      - run: pnpm check
      - run: pnpm smoke:install

      # The tag is the release, so a tag that disagrees with the manifests is a
      # mistake worth stopping on rather than publishing past.
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      # `--no-git-checks` because the workflow checks out a detached tag, which
      # pnpm otherwise refuses as not being on a branch. Every other guard above
      # is doing the work that check would have done.
      - name: Publish
        run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
