# Publish every public @renderyes/* package to npm, on a version tag.
#
# All eleven release in lockstep at one version, so one tag is one release and
# `pnpm publish -r` is the whole of it — pnpm rewrites each `workspace:*`
# dependency to that version as it packs. Publishing the packages individually
# with `npm publish` would ship `workspace:*` verbatim and 404 on install.
#
# ── Trusted publishing (OIDC) ─────────────────────────────────────────────────
# There is no publish token, and restoring one would be the regression. npm
# authorises the run by a short-lived token GitHub mints from `id-token: write`
# below, which names the repository, this filename and the environment; npm
# checks those against the trusted publisher registered on each of the eleven
# packages.
#
# Nothing verifies that agreement until a publish is attempted, so a mismatch is
# a refused release rather than a warning. Renaming this file or the environment
# breaks publishing until all eleven registrations are changed to match. pnpm
# must stay >= 11.0.7, which is when OIDC began applying per package during a
# recursive publish.
name: release

on:
  push:
    tags: ["v*"]
  # Deliberate: a release you can start by hand, for a retry after a partial
  # publish. It still runs every gate below.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Point this at a protected GitHub environment to require an approval before
    # anything reaches the registry. An unpublish window is 72 hours; a review is
    # cheaper than needing one.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The same gates as CI, re-run here rather than trusted from the commit's
      # earlier run: a tag can point at anything, and a publish cannot be undone
      # after 72 hours.
      - run: pnpm check
      - run: pnpm smoke:install

      # The tag is the release, so a tag that disagrees with the manifests is a
      # mistake worth stopping on rather than publishing past.
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      # `--no-git-checks` because the workflow checks out a detached tag, which
      # pnpm otherwise refuses as not being on a branch. Every other guard above
      # is doing the work that check would have done.
      - name: Publish
        run: pnpm publish -r --access public --no-git-checks
